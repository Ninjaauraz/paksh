        srcTitle:"स्रोत रेटिंग", srcIntro:"पक्ष जिन आउटलेट्स को ट्रैक करता है, उनकी रेटिंग और कारण।",

        methodTitle:"पक्ष कैसे काम करता है", m_doesH:"पक्ष क्या करता है",

        m_ruleH:"मूल नियम",

        m_rateH:"हम किसी प्रकाशन को कैसे आँकते हैं",
        m_rateLede:"हम हर प्रकाशन को छह संकेतों पर आँकते हैं, हर एक को −2 से +2 तक अंक देकर एक स्कोर में जोड़ा जाता है, −10 (वाम) से +10 (दक्षिण):",
        m_rateFoot:"शून्य के पास के स्कोर केंद्र हैं; शून्य से जितना दूर, झुकाव उतना मज़बूत।",
        m_axisH:"भारत में “वाम” और “दक्षिण” का अर्थ",
        m_axis:"भारत में वाम और दक्षिण केवल अर्थशास्त्र के बारे में नहीं हैं। पक्ष एक सामाजिक-वैचारिक अक्ष (धर्मनिरपेक्ष ↔ हिंदुत्व) को एक संस्थागत अक्ष (सत्ता के आलोचक ↔ सत्ता के साथ) के साथ जोड़ता है, और आर्थिक रुख को अलग से देखता है। “वाम” और “दक्षिण” वर्णनात्मक हैं, अपमान नहीं — और एक ही कसौटी पूरे स्पेक्ट्रम पर लागू होती है।",
        m_partiesH:"भारत की पार्टियाँ मोटे तौर पर कहाँ हैं",
        m_parties:"ये लेबल विचारों का वर्णन करते हैं, टीमों का नहीं — और ये मोटे अनुमान हैं, क्योंकि पार्टियाँ समय के साथ बदलती हैं और कई क्षेत्रीय पार्टियाँ किसी एक रेखा पर ठीक से नहीं बैठतीं। आम समझ के अनुसार: वाम में CPI(M) और CPI जैसी कम्युनिस्ट और समाजवादी पार्टियाँ आती हैं, जो धर्मनिरपेक्ष और कल्याण-समर्थक, श्रमिक-पहले रुख से जुड़ी हैं; दक्षिण — सबसे प्रमुख रूप से भाजपा — हिंदुत्व-प्रभावित सांस्कृतिक राष्ट्रवाद और अधिक बाज़ार-समर्थक आर्थिक रुख से जुड़ी है; केंद्र बीच में फैला है, जहाँ कांग्रेस को अक्सर केंद्र-वाम कहा जाता है और कई क्षेत्रीय पार्टियाँ मुद्दे के हिसाब से रुख मिलाती हैं। याद रखें: पक्ष समाचार आउटलेट्स को आँकता है, पार्टियों को नहीं — किसी आउटलेट का झुकाव इस बारे में है कि वह खबरों को कैसे कवर करता है, इस बारे में नहीं कि वह किसे वोट देता है।",
        m_provH:"विश्वास, विवादित और अस्थायी",

        m_readH:"पक्ष की खबर कैसे पढ़ें", m_appealH:"सुधार और अपील",
        m_appeal:"लगता है कोई रेटिंग ग़लत है? हमें आउटलेट, जिस रेटिंग से असहमत हैं, और कुछ ठोस उदाहरण — हेडलाइन या लेख — बताएँ, और हम उसे रूब्रिक के विरुद्ध फिर से देखेंगे। रेटिंग्स को चुनौती देने के लिए ही हैं।",
        footIndependence:"पक्ष एक स्वतंत्र परियोजना है और किसी दिखाए गए आउटलेट से संबद्ध नहीं है। झुकाव के लेबल अस्थायी हैं और अपील के लिए खुले हैं।",
      }
    };

    /* ---------------- helpers ---------------- */
    const imgFor = (hue) => {
      const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='480' height='300'><defs><linearGradient id='a' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='hsl(${hue} 36% 44%)'/><stop offset='1' stop-color='hsl(${(hue+38)%360} 42% 19%)'/></linearGradient><radialGradient id='b' cx='28%' cy='22%' r='65%'><stop offset='0' stop-color='rgba(255,255,255,0.30)'/><stop offset='1' stop-color='rgba(255,255,255,0)'/></radialGradient></defs><rect width='480' height='300' fill='url(%23a)'/><rect width='480' height='300' fill='url(%23b)'/></svg>`;
      return `data:image/svg+xml,${encodeURIComponent(svg)}`;
    };
    const hueOf = (s) => { let h=0; for (const c of String(s||"")) h=(h*31+c.charCodeAt(0))%360; return h; };
    const biasPct = (lc) => { const tot=(lc.left+lc.center+lc.right)||1; return {left:Math.round(lc.left/tot*100), center:Math.round(lc.center/tot*100), right:Math.round(lc.right/tot*100)}; };
    const dominant = (b) => { const k=Object.keys(b).sort((x,y)=>b[y]-b[x])[0]; return {side:k, pct:b[k]}; };
    const lbl = (side, lang) => BIAS[side][lang] || BIAS[side].en;
    const confName = (c, lang) => (({en:{low:"Low",medium:"Medium",high:"High"},hi:{low:"कम",medium:"मध्यम",high:"उच्च"}}[lang])||{})[c] || c;

    let _mode;
    function detectMode(){ if(!_mode) _mode=(async()=>{ try{ const r=await fetch("/api/topics"); if(r.ok) return "api"; }catch(e){} return "static"; })(); return _mode; }
    async function apiGet(res){ if(await detectMode()==="api"){ const r=await fetch("/api/"+res); if(r.ok) return r.json(); } const r=await fetch("data/"+res+".json?t="+Date.now()); if(!r.ok) throw new Error(res); return r.json(); }
    async function loadAll(){
      try { const [e,b,tp,sr]=await Promise.all([apiGet("events"),apiGet("blindspots"),apiGet("topics"),apiGet("sources")]);
        return {events:e.events||[], blindspots:b.events||[], topics:tp.topics||[], sources:sr.sources||[], summary:sr.summary||{}}; }
      catch(err){ console.error(err); return {events:[],blindspots:[],topics:[],sources:[],summary:{}}; }
    }

    const toCard = (e, lang) => {
      const lc = e.lean_counts || {left:0,center:0,right:0};
      return { id:e.id, topic:e.topic, srclang:e.lang||"en", created_at:e.created_at,
        headline:(lang==="hi"&&e.title_hi)?e.title_hi:e.title,
        lead:(lang==="hi"&&e.summary_hi)?e.summary_hi:e.summary,
        summary:(lang==="hi"&&e.summary_points_hi&&e.summary_points_hi.length)?e.summary_points_hi:(e.summary_points||[]),
        bias:biasPct(lc), counts:lc, sources:(lc.left+lc.center+lc.right)||e.total_sources||0,
        unrated:Math.max(0,(e.source_count||0)-(lc.left+lc.center+lc.right)),
        blindspot:e.blindspot?e.blindspot.side:null,
        auto:e.summary_method==="extractive",
        img:e.image_url||"",
        image:e.image_url||imgFor(hueOf(e.topic||e.title)) };
    };
    const toDetail = (e, lang) => { const c=toCard(e,lang);
      c.coverage=e.coverage||{}; c.outlets=e.sources||[];
      c.framing=(lang==="hi"&&e.framing_hi&&Object.keys(e.framing_hi).length)?e.framing_hi:(e.framing||{});
      return c; };

    const isHi = (lang) => lang==="hi" ? "deva" : "";



    /* ---------------- extra icons ---------------- */
    const ArrowUpRight = (p) => <svg width={p.size||24} height={p.size||24} className={p.className||""} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M7 17 17 7M7 7h10v10"/></svg>;
    const Compass = (p) => <svg width={p.size||24} height={p.size||24} className={p.className||""} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><polygon points="16.2 7.8 14.1 14.1 7.8 16.2 9.9 9.9"/></svg>;
    const Globe = (p) => <svg width={p.size||24} height={p.size||24} className={p.className||""} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 0 1 4 10 15 15 0 0 1-4 10 15 15 0 0 1-4-10 15 15 0 0 1 4-10Z"/></svg>;

    /* ---------------- presentation helpers ---------------- */
    const timeAgo = (iso, lang) => {
      const ts = Date.parse(iso||""); if (isNaN(ts)) return "";
      const m = Math.max(0,(Date.now()-ts)/60000); const hi = lang==="hi";
      if (m < 60)  return hi ? `${Math.round(m)} मिनट पहले` : `${Math.round(m)}m ago`;
      const h = m/60; if (h < 24) return hi ? `${Math.round(h)} घंटे पहले` : `${Math.round(h)}h ago`;
      const d = Math.round(h/24); return hi ? `${d} दिन पहले` : `${d}d ago`;
    };

    function Spectrum({ bias, height="h-2", t }) {
      const [m,setM]=useState(false);
      useEffect(()=>{ const r=requestAnimationFrame(()=>setM(true)); return ()=>cancelAnimationFrame(r); },[]);
      const w=(p)=>(m?`${p}%`:"0%");
      return (
        <div className={`flex w-full overflow-hidden rounded-full ${height}`} style={{background:(t&&t.line)||"#E4E4E0"}}>
          <div className="h-full transition-[width] duration-700 ease-out" style={{width:w(bias.left),   backgroundColor:BIAS.left.color}} />
          <div className="h-full transition-[width] duration-700 ease-out" style={{width:w(bias.center), backgroundColor:BIAS.center.color}} />
          <div className="h-full transition-[width] duration-700 ease-out" style={{width:w(bias.right),  backgroundColor:BIAS.right.color}} />
        </div>
      );
    }

    function Eyebrow({ topic, created_at, blindspot, t, lang }) {
      const tp = lang==="hi" ? (TOPIC_HI[topic]||topic) : topic;
      const face = lang==="hi" ? "deva" : "mono";
      return (
        <div className={`flex items-center gap-2 ${face} text-[11px] font-medium uppercase tracking-[0.13em]`}>
          <span className={t.ts}>{tp || "News"}</span>
          {created_at && <><span className={t.tf}>·</span><span className={t.tf}>{timeAgo(created_at,lang)}</span></>}
          {blindspot && <><span className={t.tf}>·</span><span className={t.blind} style={{color:BIAS[blindspot]?undefined:undefined}}>{lbl(blindspot,lang)} {STR[lang].navOS}</span></>}
        </div>
      );
    }

    function Monogram({ name, side }) {
      return <span className="grid shrink-0 place-items-center rounded-md mono text-[12px] font-semibold text-white" style={{width:30,height:30,backgroundColor:(BIAS[side]&&BIAS[side].color)||"#8A8F98"}}>{(name||"?")[0]}</span>;
    }

    const LeanChip = ({ side, lang }) => (
      <span className="inline-flex items-center rounded-full px-2.5 py-1 mono text-[10px] font-bold uppercase tracking-widest text-white" style={{backgroundColor:BIAS[side].color}}>{lbl(side,lang)}</span>
    );

    function AutoTag({ lang, t }) {
      return <span className={`inline-flex items-center gap-1 rounded mono px-1.5 py-0.5 text-[10px] font-medium uppercase tracking-wider ${t.chip} ${t.ts}`}><Sparkles size={10} strokeWidth={2.5} /> {STR[lang].autoTag}</span>;
    }

    function SectionHead({ title, sub, t, lang, onSeeAll, icon:Icon, accent }) {
      return (
        <div className="flex items-end justify-between gap-3">
          <div>
            <div className="flex items-center gap-2">
              {Icon && <Icon size={15} className={accent||t.tp} />}
              <h2 className={`text-[12px] font-bold uppercase tracking-[0.14em] ${t.tp} ${isHi(lang)}`}>{title}</h2>
            </div>
            {sub && <p className={`mt-1 text-[12px] ${t.tf} ${isHi(lang)}`}>{sub}</p>}
          </div>
          {onSeeAll && <button onClick={onSeeAll} className={`mono text-[11px] font-medium ${t.ts} flex items-center gap-1 hover:${t.tp}`}>{ui("seeAll",lang)} <ChevronRight size={13}/></button>}
        </div>
      );
    }

    /* ---------------- images / skeleton ---------------- */
    function Thumb({ src, topic, title, ratio, t, lang, className }) {
      const [err,setErr]=useState(false);
      const real = src && !err;
      const tp = lang==="hi" ? (TOPIC_HI[topic]||topic) : (topic||"News");
      return (
        <div className={`relative overflow-hidden ${t.soft} ${className||""}`} style={{aspectRatio:ratio||"16 / 9"}}>
          {real
            ? <img src={src} alt="" loading="lazy" decoding="async" onError={()=>setErr(true)} className="absolute inset-0 h-full w-full object-cover transition-transform duration-500 group-hover:scale-[1.035]" />
            : <div className="absolute inset-0 flex flex-col items-center justify-center gap-2.5">
                <span className="prism-line h-1 w-10 rounded-full opacity-80" />
                <span className={`mono text-[11px] font-semibold uppercase tracking-[0.18em] ${t.tf} ${lang==="hi"?"deva":""}`}>{tp}</span>
              </div>}
        </div>
      );
    }

    function OutletAvatar({ o, side }) {
      const [err,setErr]=useState(false);
      let host=""; try{ host=new URL(o.url).hostname.replace(/^www\./,""); }catch(e){}
      const ring = (BIAS[side]&&BIAS[side].color)||"#8A8F98";
      if (err || !host) return <Monogram name={o.source} side={side} />;
      return (
        <span className="grid h-[30px] w-[30px] shrink-0 place-items-center rounded-md bg-white" style={{boxShadow:`0 0 0 1.5px ${ring}`}}>
          <img src={`https://www.google.com/s2/favicons?domain=${host}&sz=64`} alt="" width={18} height={18} loading="lazy" onError={()=>setErr(true)} className="object-contain" />
        </span>
      );
    }

    function FeedSkeleton({ t }) {
      const Card=()=>(
        <div className={`overflow-hidden rounded-2xl border ${t.surface} ${t.border}`}>
          <div className="skel w-full" style={{aspectRatio:"16 / 9", borderRadius:0}} />
          <div className="p-5">
            <div className="skel mb-3 h-3 w-24" />
            <div className="skel mb-2 h-5 w-full" />
            <div className="skel mb-4 h-5 w-3/4" />
            <div className="skel h-2 w-full rounded-full" />
          </div>
        </div>
      );
      return (
        <div className="fade-up pt-6">
          <div className={`mb-8 overflow-hidden rounded-3xl border ${t.surface} ${t.border}`}>
            <div className="skel w-full" style={{aspectRatio:"21 / 9", borderRadius:0}} />
            <div className="p-8">
              <div className="skel mb-4 h-4 w-28" />
              <div className="skel mb-3 h-9 w-3/4" />
              <div className="skel h-9 w-1/2" />
            </div>
          </div>
          <div className="grid gap-5 sm:grid-cols-2 lg:grid-cols-3">
            {[0,1,2,3,4,5].map(i=><Card key={i} />)}
          </div>
        </div>
      );
    }

    /* ---------------- cards ---------------- */
    function StoryCard({ story, t, lang, onOpen }) {
      const total = story.sources + (story.unrated||0);
      return (
        <button onClick={()=>onOpen(story.id)} className={`group hover-lift w-full overflow-hidden text-left rounded-2xl border ${t.surface} ${t.border} hover:shadow-[0_10px_34px_rgba(0,0,0,0.08)]`}>
          <Thumb src={story.img} topic={story.topic} title={story.headline} ratio="16 / 9" t={t} lang={lang} />
          <div className="p-5">
          <div className="mb-2.5 flex items-center justify-between gap-3">
            <Eyebrow topic={story.topic} created_at={story.created_at} blindspot={story.blindspot} t={t} lang={lang} />
            {story.auto && <AutoTag lang={lang} t={t} />}
          </div>
          <h3 className={`editorial-heading mb-4 line-clamp-3 text-lg sm:text-xl font-medium leading-[1.18] tracking-[-0.01em] ${t.tp} ${isHi(lang)}`}>{story.headline}</h3>
          <Spectrum bias={story.bias} t={t} height="h-1.5" />
          <div className="mt-3 flex items-center justify-between">
            <div className="flex items-center gap-3 mono text-[11px]">
              {["left","center","right"].map(k=>(
                <span key={k} className="flex items-center gap-1" style={{color:BIAS[k].color}}>
                  <span className="inline-block h-2 w-2 rounded-full" style={{backgroundColor:BIAS[k].color}} />{story.counts[k]}
                </span>
              ))}
            </div>
            <span className={`mono text-[11px] ${t.tf}`}>{total} {total===1?STR[lang].source:STR[lang].sources}</span>
          </div>
          </div>
        </button>
      );
    }

    function HeroCard({ story, t, lang, onOpen }) {
      const total = story.sources + (story.unrated||0);
      return (
        <button onClick={()=>onOpen(story.id)} className={`group hover-lift w-full overflow-hidden text-left rounded-3xl border ${t.surface} ${t.border} hover:shadow-[0_16px_50px_rgba(0,0,0,0.10)]`}>
          <Thumb src={story.img} topic={story.topic} title={story.headline} ratio="21 / 9" t={t} lang={lang} />
          <div className="p-6 sm:p-8 lg:p-9">
          <div className="mb-4 flex items-center justify-between gap-3">
            <Eyebrow topic={story.topic} created_at={story.created_at} blindspot={story.blindspot} t={t} lang={lang} />
            {story.auto && <AutoTag lang={lang} t={t} />}
          </div>
          <div className="grid items-start gap-7 lg:grid-cols-[1.5fr_1fr] lg:gap-10">
            <div>
              <h2 className={`editorial-heading text-[1.9rem] sm:text-4xl lg:text-[2.7rem] font-medium leading-[1.07] tracking-[-0.02em] ${t.tp} ${isHi(lang)}`}>{story.headline}</h2>
              {story.lead && <p className={`mt-4 line-clamp-3 text-[15px] sm:text-base leading-relaxed ${t.ts} ${isHi(lang)}`}>{story.lead}</p>}
            </div>
            <div className={`rounded-2xl border p-5 ${t.soft} ${t.border}`}>
              <div className={`mb-3 mono text-[10px] font-medium uppercase tracking-[0.16em] ${t.tf}`}>{STR[lang].whereLean}</div>
              <Spectrum bias={story.bias} t={t} height="h-2.5" />
              <div className="mt-4 space-y-2.5">
                {["left","center","right"].map(k=>(
                  <div key={k} className="flex items-center gap-2.5">
                    <span className="h-2.5 w-2.5 rounded-full" style={{backgroundColor:BIAS[k].color}} />
                    <span className="text-[13px] font-semibold" style={{color:BIAS[k].color}}>{lbl(k,lang)}</span>
                    <span className={`ml-auto mono text-[13px] font-semibold ${t.tp}`}>{story.counts[k]}</span>
                  </div>
                ))}
              </div>
              <div className={`mt-4 flex items-center justify-between border-t pt-3 ${t.border}`}>
                <span className={`mono text-[11px] ${t.tf}`}>{total} {STR[lang].sources}</span>
                <span className={`inline-flex items-center gap-1 text-[13px] font-semibold ${t.tp}`}>{STR[lang].seeCoverage} <ArrowUpRight size={14}/></span>
              </div>
            </div>
          </div>
          </div>
        </button>
      );
    }

    function OneSidedCard({ story, t, lang, onOpen }) {
      const side = story.blindspot;
      return (
        <button onClick={()=>onOpen(story.id)} className={`group hover-lift w-full text-left rounded-2xl border p-5 sm:p-6 ${t.surface} ${t.border}`} style={{borderLeftWidth:4, borderLeftColor:(side&&BIAS[side].color)||(t.line)}}>
          <div className="mb-3 flex items-center gap-2 mono text-[11px] font-semibold uppercase tracking-widest">
            <Eye size={14} className={t.blind} />
            <span className={t.blind}>{side?lbl(side,lang):""} · {STR[lang].navOS}</span>
          </div>
          <h3 className={`editorial-heading mb-4 line-clamp-3 text-lg sm:text-xl font-medium leading-snug ${t.tp} ${isHi(lang)}`}>{story.headline}</h3>
          <Spectrum bias={story.bias} t={t} height="h-1.5" />
          {side && <p className={`mt-3 text-[12px] leading-relaxed ${t.ts} ${isHi(lang)}`}>{STR[lang].osCalloutBody1} <strong style={{color:BIAS[side].color}}>{story.bias[side]}%</strong> {STR[lang].osCalloutBody2}</p>}
        </button>
      );
    }

    function OneSidedStrip({ items, t, lang, onOpen }) {
      if(!items.length) return null;
      return (
        <div className="mb-7 lg:hidden">
          <div className="mb-3 flex items-center gap-2"><Eye size={16} className={t.blind}/><span className={`text-sm font-bold ${t.tp} ${isHi(lang)}`}>{STR[lang].navOS}</span></div>
          <div className="-mx-4 flex gap-4 overflow-x-auto px-4 pb-2">
            {items.slice(0,6).map(s=>(<div key={s.id} className="w-[18rem] shrink-0"><OneSidedCard story={s} t={t} lang={lang} onOpen={onOpen}/></div>))}
          </div>
        </div>
      );
    }

    function TopicChips({ topics, t, lang, onPick }) {
      if(!topics.length) return null;
      return (
        <div className="-mx-4 mb-6 flex gap-2 overflow-x-auto px-4 pb-2 lg:hidden">
          {topics.map(tp=>(<button key={tp} onClick={()=>onPick(tp)} className={`shrink-0 rounded-full border px-3.5 py-1.5 text-[13px] font-semibold ${t.surface} ${t.border} ${t.ts} ${lang==="hi"?"deva":""}`}>{lang==="hi"?(TOPIC_HI[tp]||tp):tp}</button>))}
        </div>
      );
    }

    /* ---------------- header / bottom nav ---------------- */
    function Header({ t, lang, setLang, dark, setDark, go, view }) {
      const Nav = ({k,children}) => (
        <button onClick={()=>go(k)} className={`relative px-0.5 py-1 text-[13px] font-semibold transition-colors ${view===k?t.tp:`${t.ts} hover:${t.tp}`}`}>
          {children}
          {view===k && <span className="prism-line absolute -bottom-[6px] left-0 right-0 h-[2px] rounded-full" />}
        </button>
      );
      return (
        <header className={`sticky top-0 z-40 border-b ${t.border} ${t.nav}`}>
          <div className="mx-auto max-w-6xl px-4 sm:px-6">
            <div className="flex h-16 items-center gap-4">
              <button onClick={()=>go("home")} className="flex shrink-0 items-center gap-2" aria-label="Paksh home">
                <span className="deva prism-text text-2xl font-bold leading-none">पक्ष</span>
                <span className="flex flex-col leading-none">
                  <span className={`text-[17px] font-bold tracking-tight ${t.tp}`}>Paksh</span>
                  <span className="prism-line mt-1 h-[2px] w-full rounded-full" />
                </span>
              </button>
              <nav className="ml-4 hidden items-center gap-6 md:flex">
                <Nav k="home">{STR[lang].navTop}</Nav>
                <Nav k="os">{STR[lang].navOS}</Nav>
                <Nav k="sections">{ui("sections",lang)}</Nav>
                <Nav k="sources">{STR[lang].navSrc}</Nav>
                <Nav k="method">{STR[lang].navMethod}</Nav>
              </nav>
              <div className="ml-auto flex items-center gap-1.5">
                <button onClick={()=>go("search")} aria-label="Search" className={`grid h-9 w-9 place-items-center rounded-full ${t.ts} hover:${t.soft}`}><Search size={18}/></button>
                <div className={`flex items-center overflow-hidden rounded-full border ${t.border}`}>
                  {["en","hi"].map(l=>(<button key={l} onClick={()=>setLang(l)} className={`px-2.5 py-1 text-[12px] font-bold ${lang===l?`${t.cta} ${t.ctaT}`:t.ts} ${l==="hi"?"deva":""}`}>{l==="en"?"EN":"हिं"}</button>))}
                </div>
                <button onClick={()=>setDark(!dark)} aria-label="Toggle theme" className={`grid h-9 w-9 place-items-center rounded-full ${t.ts} hover:${t.soft}`}>{dark?<Sun size={18}/>:<Moon size={18}/>}</button>
              </div>
            </div>
          </div>
        </header>
      );
    }

    function BottomNav({ t, lang, view, go }) {
      const items=[["home",STR[lang].navTop,Layers],["os",STR[lang].navOS,Eye],["sections",ui("sections",lang),Compass],["sources",STR[lang].navSrc,Globe],["method",STR[lang].navMethod,Scale]];
      return (
        <nav className={`fixed inset-x-0 bottom-0 z-40 border-t md:hidden ${t.border} ${t.nav}`}>
          <div className="flex items-stretch justify-around">
            {items.map(([k,label,Icon])=>(
              <button key={k} onClick={()=>go(k)} className={`flex flex-1 flex-col items-center gap-1 py-2.5 ${view===k?t.tp:t.tf}`}>
                <Icon size={20}/>
                <span className={`text-[10px] font-semibold ${lang==="hi"?"deva":""}`}>{label}</span>
              </button>
            ))}
          </div>
        </nav>
      );
    }

    /* ---------------- home ---------------- */
    function HomeView({ cards, oneSided, topics, counts, t, lang, open, goSection, goOS }) {
      const hero = cards[0]; const rest = cards.slice(1);
      return (
        <div className="fade-up">
          <div className="flex items-center gap-3 pt-6 pb-5">
            <span className="prism-line h-4 w-1 rounded-full" />
            <p className={`text-[13px] sm:text-sm font-medium ${t.ts} ${isHi(lang)}`}>{STR[lang].tagline}</p>
          </div>
          {hero && <div className="mb-8"><HeroCard story={hero} t={t} lang={lang} onOpen={open} /></div>}

          <OneSidedStrip items={oneSided} t={t} lang={lang} onOpen={open} />
          <TopicChips topics={topics} t={t} lang={lang} onPick={goSection} />

          <div className="grid gap-8 lg:grid-cols-[1fr_300px]">
            <div className="grid gap-5 sm:grid-cols-2">
              {rest.map(s=><StoryCard key={s.id} story={s} t={t} lang={lang} onOpen={open} />)}
            </div>
            <aside className="hidden space-y-9 lg:block">
              {oneSided.length>0 && (
                <div>
                  <SectionHead title={STR[lang].navOS} sub={STR[lang].osSub} icon={Eye} accent={t.blind} t={t} lang={lang} onSeeAll={goOS} />
                  <div className="mt-4 space-y-4">{oneSided.slice(0,3).map(s=><OneSidedCard key={s.id} story={s} t={t} lang={lang} onOpen={open} />)}</div>
                </div>
              )}
              {topics.length>0 && (
                <div>
                  <SectionHead title={ui("sections",lang)} icon={Compass} t={t} lang={lang} />
                  <div className="mt-3">
                    {topics.map(tp=>(
                      <button key={tp} onClick={()=>goSection(tp)} className={`group flex w-full items-center justify-between border-b py-2.5 ${t.border}`}>
                        <span className={`text-sm font-semibold ${t.ts} group-hover:${t.tp} ${lang==="hi"?"deva":""}`}>{lang==="hi"?(TOPIC_HI[tp]||tp):tp}</span>
                        <span className={`mono text-[11px] ${t.tf}`}>{counts[tp]}</span>
                      </button>
                    ))}
                  </div>
                </div>
              )}
            </aside>
          </div>
        </div>
      );
    }

    function SectionsHub({ topics, counts, t, lang, goSection }) {
      return (
        <div className="fade-up pt-6">
          <h1 className={`editorial-heading mb-6 text-3xl sm:text-4xl font-medium tracking-tight ${t.tp} ${isHi(lang)}`}>{ui("sections",lang)}</h1>
          <div className="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
            {topics.map(tp=>(
              <button key={tp} onClick={()=>goSection(tp)} className={`hover-lift rounded-2xl border p-6 text-left ${t.surface} ${t.border}`}>
                <div className={`mono text-5xl font-semibold ${t.tp}`}>{counts[tp]}</div>
                <div className={`mt-2 text-base font-bold ${t.ts} ${lang==="hi"?"deva":""}`}>{lang==="hi"?(TOPIC_HI[tp]||tp):tp}</div>
              </button>
            ))}
          </div>
        </div>
      );
    }

    function SectionView({ title, items, t, lang, open, onBack }) {
      return (
        <div className="fade-up pt-6">
          <button onClick={onBack} className={`mb-6 inline-flex items-center gap-2 mono text-[12px] font-medium uppercase tracking-wider ${t.ts} hover:${t.tp}`}><ArrowLeft size={15}/> {ui("sections",lang)}</button>
          <h1 className={`editorial-heading mb-6 text-3xl sm:text-4xl font-medium tracking-tight ${t.tp} ${isHi(lang)}`}>{lang==="hi"?(TOPIC_HI[title]||title):title}</h1>
          {items.length ? <div className="grid gap-5 sm:grid-cols-2 lg:grid-cols-3">{items.map(s=><StoryCard key={s.id} story={s} t={t} lang={lang} onOpen={open}/>)}</div>
            : <div className={`py-24 text-center ${t.tf} ${isHi(lang)}`}>{STR[lang].noStories}</div>}
        </div>
      );
    }

    /* ---------------- story detail ---------------- */
    function StoryPage({ story, t, lang, onBack }) {
      const side = story.blindspot;
      const order = ["left","center","right"];
      const sides = order.filter(k=>(story.outlets||[]).some(o=>o.lean===k));
      const fr = story.framing || {};
      const fsides = order.filter(k=>(fr[k]||"").trim());
      const total = story.sources + (story.unrated||0);
      return (
        <div className="fade-up pb-24 pt-6">
          <button onClick={onBack} className={`group mb-7 inline-flex items-center gap-2 mono text-[12px] font-medium uppercase tracking-wider ${t.ts} hover:${t.tp}`}><ArrowLeft size={15} className="transition-transform group-hover:-translate-x-1"/> {STR[lang].back}</button>
          <div className="mb-7 max-w-3xl">
            <Eyebrow topic={story.topic} created_at={story.created_at} blindspot={side} t={t} lang={lang} />
            <h1 className={`editorial-heading mt-3 text-3xl sm:text-5xl lg:text-[3.3rem] font-medium leading-[1.07] tracking-[-0.02em] ${t.tp} ${isHi(lang)}`}>{story.headline}</h1>
          </div>
          {story.img && <div className="group mb-9 max-w-4xl"><Thumb src={story.img} topic={story.topic} title={story.headline} ratio="2 / 1" t={t} lang={lang} className={`rounded-2xl border ${t.border}`} /></div>}

          <div className="grid gap-8 lg:grid-cols-[1fr_330px] lg:gap-12">
            <div className="min-w-0">
              {/* spectrum panel — the thesis */}
              <div className={`mb-9 rounded-2xl border p-6 ${t.surface} ${t.border}`}>
                <div className="mb-4 flex items-baseline justify-between">
                  <span className={`mono text-[11px] uppercase tracking-[0.16em] ${t.tf}`}>{STR[lang].whereLean}</span>
                  <span className={`mono text-[12px] ${t.ts}`}><span className={`text-2xl font-semibold ${t.tp}`}>{total}</span> {STR[lang].sources}</span>
                </div>
                <Spectrum bias={story.bias} t={t} height="h-3" />
                <div className="mt-5 grid grid-cols-3 gap-3">
                  {order.map(k=>(
                    <div key={k} className={`rounded-xl border p-3 ${t.border}`} style={{borderTopWidth:3, borderTopColor:BIAS[k].color}}>
                      <div className="text-[12px] font-bold" style={{color:BIAS[k].color}}>{lbl(k,lang)}</div>
                      <div className={`mono text-2xl font-semibold leading-tight ${t.tp}`}>{story.counts[k]}</div>
                      <div className={`mono text-[10px] ${t.tf}`}>{story.bias[k]}%</div>
                    </div>
                  ))}
                </div>
                {side && (
                  <div className={`mt-4 flex items-start gap-2.5 rounded-xl p-4 text-[13px] leading-relaxed ${t.blindSoft} ${t.blind} ${isHi(lang)}`}>
                    <Eye size={18} strokeWidth={2.3} className="mt-0.5 shrink-0"/>
                    <span><strong className="font-bold uppercase tracking-wide">{lbl(side,lang)} · {STR[lang].navOS}</strong><br/>{STR[lang].osCalloutBody1} <strong>{story.bias[side]}%</strong> {STR[lang].osCalloutBody2}</span>
                  </div>
                )}
              </div>

              {/* neutral summary */}
              <div className={`mb-9 rounded-2xl border p-6 sm:p-7 ${t.soft} ${t.border}`}>
                <div className={`mb-5 flex flex-wrap items-center gap-2 border-b pb-3 ${t.border}`}>
                  <Sparkles size={16} className={t.ts}/>
                  <span className={`mono text-[11px] font-medium uppercase tracking-[0.16em] ${t.ts}`}>{story.auto?STR[lang].autoTag:STR[lang].aiSummary}</span>
                  <span className={`text-[12px] ${t.tf} ${isHi(lang)}`}>· {story.auto?STR[lang].autoFrom:STR[lang].aiSub}</span>
                </div>
                {story.auto && <p className={`mb-4 text-[13px] leading-relaxed ${t.ts} ${isHi(lang)}`}>{STR[lang].autoNote}</p>}
                {story.lead && <p className={`mb-5 text-base sm:text-lg font-medium leading-relaxed ${t.tp} ${isHi(lang)}`}>{story.lead}</p>}
                <ul className="space-y-3.5">
                  {(story.summary||[]).map((p,i)=>(
                    <li key={i} className={`flex gap-3 text-[15px] leading-relaxed ${t.tp} ${isHi(lang)}`}><span className="mt-2 h-1.5 w-1.5 shrink-0 rounded-full" style={{background:t.ink}}/>{p}</li>
                  ))}
                </ul>
              </div>

              {/* framing refraction — signature */}
              {fsides.length ? (
                <div className="mb-9">
                  <div className="mb-4">
                    <h2 className={`editorial-heading text-xl sm:text-2xl font-medium ${t.tp} ${isHi(lang)}`}>{STR[lang].framingTitle}</h2>
                    <p className={`mt-1 text-[13px] ${t.ts} ${isHi(lang)}`}>{STR[lang].framingSub}</p>
                  </div>
                  <div className="grid gap-4 sm:grid-cols-3">
                    {fsides.map(k=>(
                      <div key={k} className={`rounded-2xl border p-5 ${t.surface} ${t.border}`} style={{borderTopWidth:4, borderTopColor:BIAS[k].color}}>
                        <div className="mb-3 flex items-center gap-2">
                          <span className="h-2.5 w-2.5 rounded-full" style={{backgroundColor:BIAS[k].color}}/>
                          <span className="mono text-[11px] font-bold uppercase tracking-widest" style={{color:BIAS[k].color}}>{lbl(k,lang)}</span>
                        </div>
                        <p className={`text-[14px] leading-relaxed ${t.tp} ${isHi(lang)}`}>{fr[k]}</p>
                      </div>
                    ))}
                  </div>
                </div>
              ) : story.auto ? (
                <div className={`mb-9 rounded-2xl border border-dashed p-5 ${t.border}`}>
                  <div className={`flex items-center gap-2 mono text-[12px] font-medium uppercase tracking-widest ${t.ts} ${isHi(lang)}`}><Scale size={16}/> {STR[lang].framingTitle}</div>
                  <p className={`mt-2 text-[13px] ${t.tf} ${isHi(lang)}`}>{STR[lang].framingPending}</p>
                </div>
              ) : null}

              {/* side by side */}
              <h2 className={`editorial-heading mb-5 text-xl sm:text-2xl font-medium ${t.tp} ${isHi(lang)}`}>{STR[lang].sideBySide}</h2>
              <div className="space-y-7">
                {sides.map(k=>{
                  const outs=(story.outlets||[]).filter(o=>o.lean===k);
                  return (
                    <div key={k}>
                      <div className="mb-3 flex items-center gap-3">
                        <LeanChip side={k} lang={lang}/>
                        <span className={`mono text-[11px] ${t.tf}`}>{outs.length} {outs.length===1?STR[lang].source:STR[lang].sources}</span>
                        <span className="prism-line ml-1 h-px flex-1 rounded-full opacity-25"/>
                      </div>
                      <div className="grid gap-3 sm:grid-cols-2">
                        {outs.map((o,i)=>(
                          <a key={i} href={o.url||"#"} target="_blank" rel="noopener" className={`hover-lift block rounded-xl border p-4 ${t.surface} ${t.border}`} style={{borderLeftWidth:4, borderLeftColor:BIAS[k].color}}>
                            <div className="mb-2.5 flex items-center gap-2.5">
                              <OutletAvatar o={o} side={k}/>
                              <span className={`text-[13px] font-bold ${t.tp}`}>{o.source}</span>
                              <span className={`mono text-[10px] ${t.tf}`}>{(o.language||"en").toUpperCase()}</span>
                              <ArrowUpRight size={14} className={`ml-auto ${t.tf}`}/>
                            </div>
                            {o.headline && <div className={`editorial-heading text-[15px] sm:text-base font-medium italic leading-snug ${t.tp} ${isHi(lang)}`}>“{o.headline}”</div>}
                          </a>
                        ))}
                      </div>
                    </div>
                  );
                })}
              </div>

              {/* unrated */}
              {(() => {
                const uns=(story.outlets||[]).filter(o=>o.lean==="unrated");
                if(!uns.length) return null;
                return (
                  <div className="mt-8">
                    <div className="mb-2 flex items-center gap-2">
                      <span className={`rounded-full px-2.5 py-1 mono text-[10px] font-bold uppercase tracking-widest ${t.chip} ${t.ts}`}>{STR[lang].unratedTitle}</span>
                      <span className={`mono text-[11px] ${t.tf}`}>{uns.length}</span>
                    </div>
                    <p className={`mb-3 text-[12px] ${t.tf} ${isHi(lang)}`}>{STR[lang].unratedNote}</p>
                    <div className="flex flex-wrap gap-2">
                      {uns.map((o,i)=>(<a key={i} href={o.url||"#"} target="_blank" rel="noopener" className={`rounded-lg border px-3 py-1.5 text-[12px] font-semibold ${t.surface} ${t.border} ${t.ts}`}>{o.source}</a>))}
                    </div>
                  </div>
                );
              })()}
            </div>

            {/* sticky coverage breakdown */}
            <aside className="hidden lg:block">
              <div className={`sticky top-24 rounded-2xl border p-6 ${t.surface} ${t.border}`}>
                <div className={`mb-4 mono text-[11px] uppercase tracking-[0.16em] ${t.tf}`}>{STR[lang].coverageBreakdown}</div>
                <div className={`mono text-6xl font-semibold leading-none ${t.tp}`}>{total}</div>
                <div className={`mt-1 text-[13px] font-semibold ${t.ts} ${isHi(lang)}`}>{STR[lang].totalSources}</div>
                <div className="my-5"><Spectrum bias={story.bias} t={t} height="h-2.5"/></div>
                <div className="space-y-3">
                  {order.map(k=>(
                    <div key={k} className="flex items-center gap-2.5">
                      <span className="h-3 w-3 rounded-full" style={{backgroundColor:BIAS[k].color}}/>
                      <span className="text-[13px] font-bold" style={{color:BIAS[k].color}}>{lbl(k,lang)}</span>
                      <span className={`ml-auto mono text-[15px] font-semibold ${t.tp}`}>{story.counts[k]}</span>
                    </div>
                  ))}
                  {story.unrated>0 && (
                    <div className="flex items-center gap-2.5">
                      <span className={`h-3 w-3 rounded-full ${t.chip}`}/>
                      <span className={`text-[13px] font-bold ${t.tf}`}>{STR[lang].unratedTitle}</span>
                      <span className={`ml-auto mono text-[15px] font-semibold ${t.tp}`}>{story.unrated}</span>
                    </div>
                  )}
                </div>
                <p className={`mt-6 border-t pt-5 text-[11px] leading-relaxed ${t.border} ${t.tf} ${isHi(lang)}`}>{STR[lang].aiNote}</p>
              </div>
            </aside>
          </div>
        </div>
      );
    }

    /* ---------------- sources directory ---------------- */
    function SourceCard({ s, t, lang }) {
      const side = ["left","center","right"].includes(s.lean) ? s.lean : null;
      return (
        <div className={`rounded-2xl border p-5 ${t.surface} ${t.border}`} style={side?{borderLeftWidth:4, borderLeftColor:BIAS[side].color}:{}}>
          <div className="flex items-start justify-between gap-3">
            <div className="min-w-0">
              <div className={`text-[15px] font-bold ${t.tp}`}>{s.name}</div>
              {s.website && <a href={s.website} target="_blank" rel="noopener" className={`mono text-[11px] break-all ${t.tf} hover:${t.ts}`}>{(s.website||"").replace(/^https?:\/\//,"")}</a>}
            </div>
            {side ? <LeanChip side={side} lang={lang}/> : <span className={`rounded-full px-2.5 py-1 mono text-[10px] font-bold uppercase tracking-widest ${t.chip} ${t.ts}`}>{s.label||"—"}</span>}
          </div>
          <div className="mt-3 flex flex-wrap items-center gap-2">
            <span className={`mono text-[10px] uppercase tracking-wider ${t.tf}`}>{(s.language||"en").toUpperCase()}</span>
            {s.confidence && <span className={`mono text-[10px] ${t.tf}`}>· conf {s.confidence}</span>}
            {s.contested && <span className={`rounded px-1.5 py-0.5 mono text-[10px] font-bold ${t.blindSoft} ${t.blind}`}>{STR[lang].contested}</span>}
          </div>
          {s.ownership && <div className={`mt-3 text-[12px] leading-relaxed ${t.ts} ${isHi(lang)}`}><span className={`font-semibold ${t.tp}`}>{STR[lang].ownership}:</span> {s.ownership}</div>}
          {s.rationale && <p className={`mt-2 text-[12px] leading-relaxed ${t.tf} ${isHi(lang)}`}>{s.rationale}</p>}
        </div>
      );
    }

    function SourcesPage({ t, lang, sources }) {
      const [f,setF]=useState("all");
      const list=(sources||[]).filter(s=>f==="all"||s.lean===f);
      const filters=[["all", lang==="hi"?"सभी":"All"],["left",lbl("left",lang)],["center",lbl("center",lang)],["right",lbl("right",lang)]];
      return (
        <div className="fade-up pt-6">
          <h1 className={`editorial-heading text-3xl sm:text-4xl font-medium tracking-tight ${t.tp} ${isHi(lang)}`}>{STR[lang].srcTitle}</h1>
          <p className={`mb-6 mt-2 max-w-2xl text-sm leading-relaxed ${t.ts} ${isHi(lang)}`}>{STR[lang].srcDisclaimer}</p>
          <div className="mb-6 flex flex-wrap gap-2">
            {filters.map(([k,label])=>(<button key={k} onClick={()=>setF(k)} className={`rounded-full border px-3.5 py-1.5 text-[13px] font-semibold ${f===k?`${t.cta} ${t.ctaT} border-transparent`:`${t.surface} ${t.border} ${t.ts}`} ${lang==="hi"?"deva":""}`}>{label}</button>))}
          </div>
          <div className="grid gap-4 sm:grid-cols-2 lg:grid-cols-3">
            {list.map(s=><SourceCard key={s.id||s.name} s={s} t={t} lang={lang}/>)}
          </div>
        </div>
      );
    }

    /* ---------------- method ---------------- */
    function MethodPage({ t, lang }) {
      const Row=({h,children})=>(
        <div className={`border-b py-6 ${t.border}`}>
          <h2 className={`editorial-heading mb-2 text-xl font-medium ${t.tp} ${isHi(lang)}`}>{h}</h2>
          <div className={`text-[14px] leading-relaxed ${t.ts} ${isHi(lang)}`}>{children}</div>
        </div>
      );
      return (
        <div className="fade-up max-w-3xl pt-6">
          <h1 className={`editorial-heading text-3xl sm:text-4xl font-medium tracking-tight ${t.tp} ${isHi(lang)}`}>{STR[lang].methodTitle}</h1>
          <p className={`mb-3 mt-3 text-[15px] leading-relaxed ${t.ts} ${isHi(lang)}`}>{STR[lang].m_does}</p>
          <Row h={STR[lang].m_ruleH}>{STR[lang].m_rule}</Row>
          <Row h={STR[lang].m_rateH}><p className="mb-2">{STR[lang].m_rateLede}</p><p className={`text-[12px] ${t.tf}`}>{STR[lang].m_rateFoot}</p></Row>
          <Row h={STR[lang].m_axisH}>{STR[lang].m_axis}</Row>
          <Row h={STR[lang].m_partiesH}>{STR[lang].m_parties}</Row>
          <Row h={STR[lang].m_provH}>{STR[lang].m_prov}</Row>
          <Row h={STR[lang].m_readH}>{STR[lang].m_appeal}</Row>
        </div>
      );
    }

    /* ---------------- app ---------------- */
    function PakshApp() {
      const [lang,setLang]=useState("en");
      const [dark,setDark]=useState(false);
      const [query,setQuery]=useState("");
      const [view,setView]=useState("home");
      const [topic,setTopic]=useState(null);
      const [openId,setOpenId]=useState(null);
      const [data,setData]=useState({events:[],blindspots:[],topics:[],sources:[],summary:{}});
      const [detail,setDetail]=useState({});
      const [ready,setReady]=useState(false);

      useEffect(()=>{ loadAll().then(d=>{ setData(d); setReady(true); }); },[]);
      useEffect(()=>{ document.documentElement.classList.toggle("dark",dark); document.body.style.backgroundColor = dark?"#0E0F12":"#EEEEEC"; },[dark]);
      useEffect(()=>{ setTopic(null); setOpenId(null); setView("home"); },[lang]);

      const t = dark?TOKENS.dark:TOKENS.light;
      const go=(k)=>{ setView(k); setOpenId(null); setQuery(""); setTopic(null); window.scrollTo({top:0,behavior:"smooth"}); };
      const goSection=(tp)=>{ setTopic(tp); setView("section"); setOpenId(null); setQuery(""); window.scrollTo({top:0,behavior:"smooth"}); };
      const open=async(id)=>{ if(!detail[id]){ let full=null; try{ full=await apiGet("events/"+id); }catch(e){ full=(data.events||[]).concat(data.blindspots||[]).find(x=>x.id===id)||null; if(!full){ console.error("open failed",id,e); return; } } setDetail(d=>({...d,[id]:full})); } setOpenId(id); window.scrollTo({top:0,behavior:"smooth"}); };
      const back=()=>{ setOpenId(null); window.scrollTo({top:0,behavior:"smooth"}); };
      const openStory = (openId!=null && detail[openId]) ? toDetail(detail[openId],lang) : null;

      const importance = c => { const n=c.counts||{}; const spread=[n.left,n.center,n.right].filter(x=>x>0).length||1; return (c.sources||0)*spread; };
      const ageHours = c => { const tt=Date.parse(c.created_at||""); return isNaN(tt)?9999:Math.max(0,(Date.now()-tt)/3600000); };
      const GRAVITY = 1.4;
      const score = c => (importance(c)+2)/Math.pow(ageHours(c)+2,GRAVITY);
      const byImportance = (a,b)=>score(b)-score(a);
      const baseCards = data.events.map(e=>toCard(e,lang)).filter(c=>c.srclang===lang).sort(byImportance);
      const baseOne   = data.blindspots.map(e=>toCard(e,lang)).filter(c=>c.srclang===lang).sort(byImportance);
      const countsByTopic = {}; baseCards.forEach(c=>{ const k=c.topic||"Society"; countsByTopic[k]=(countsByTopic[k]||0)+1; });
      const topicsOrdered = Object.keys(countsByTopic).sort((a,b)=>countsByTopic[b]-countsByTopic[a]);
      const sectionCards = topic?baseCards.filter(c=>c.topic===topic):[];
      const q=query.trim().toLowerCase();
      const results = q?baseCards.filter(c=>(c.headline||"").toLowerCase().includes(q)):[];

      return (
        <div className={`min-h-screen font-sans ${t.bg} ${t.tp}`}>
          <Header t={t} lang={lang} setLang={setLang} dark={dark} setDark={setDark} go={go} view={openStory?"":view} />
          <main className="mx-auto max-w-6xl px-4 pb-28 sm:px-6 md:pb-20">
            {!ready ? (
              <FeedSkeleton t={t} />
            ) : openStory ? (
              <StoryPage story={openStory} t={t} lang={lang} onBack={back} />
            ) : view==="sources" ? (
              <SourcesPage t={t} lang={lang} sources={data.sources} />
            ) : view==="method" ? (
              <MethodPage t={t} lang={lang} />
            ) : view==="search" ? (
              <div className="pt-6">
                <div className="relative mb-6 max-w-xl">
                  <Search size={18} className={`absolute left-4 top-1/2 -translate-y-1/2 ${t.tf}`} />
                  <input autoFocus value={query} onChange={(e)=>setQuery(e.target.value)} placeholder={STR[lang].search} className={`w-full rounded-full border py-3 pl-11 pr-4 text-base outline-none focus:border-[#2D5BD0] ${t.surface} ${t.border} ${t.tp} ${isHi(lang)}`} />
                </div>
                {!q ? <div className={`py-24 text-center ${t.tf} ${isHi(lang)}`}>{ui("searchHint",lang)}</div>
                  : results.length ? <div className="grid gap-5 sm:grid-cols-2 lg:grid-cols-3">{results.map(s=><StoryCard key={s.id} story={s} t={t} lang={lang} onOpen={open}/>)}</div>
                  : <div className={`py-24 text-center ${t.tf} ${isHi(lang)}`}><p className={`text-lg font-bold ${t.ts}`}>{STR[lang].noResults}</p><p className="mt-1 text-sm">{STR[lang].noResultsSub}</p></div>}
              </div>
            ) : view==="sections" ? (
              <SectionsHub topics={topicsOrdered} counts={countsByTopic} t={t} lang={lang} goSection={goSection} />
            ) : view==="section" ? (
              <SectionView title={topic} items={sectionCards} t={t} lang={lang} open={open} onBack={()=>go("sections")} />
            ) : view==="os" ? (
              <div className="pt-6">
                <div className="mb-2 flex items-center gap-2.5"><Eye size={24} className={t.blind}/><h1 className={`editorial-heading text-3xl sm:text-4xl font-medium tracking-tight ${t.tp} ${isHi(lang)}`}>{STR[lang].osTitle}</h1></div>
                <p className={`mb-7 max-w-2xl text-sm leading-relaxed ${t.ts} ${isHi(lang)}`}>{STR[lang].osSub}</p>
                {baseOne.length ? <div className="grid gap-5 sm:grid-cols-2 lg:grid-cols-3">{baseOne.map(s=><OneSidedCard key={s.id} story={s} t={t} lang={lang} onOpen={open}/>)}</div>
                  : <div className={`py-24 text-center ${t.tf} ${isHi(lang)}`}>{STR[lang].noStories}</div>}
              </div>
            ) : (
              !baseCards.length ? <div className={`py-28 text-center ${t.tf} ${isHi(lang)}`}>{STR[lang].noStories}</div>
              : <HomeView cards={baseCards} oneSided={baseOne} topics={topicsOrdered} counts={countsByTopic} t={t} lang={lang} open={open} goSection={goSection} goOS={()=>go("os")} />
            )}
          </main>
          {!openStory && (
            <footer className={`border-t ${t.border} ${t.surface}`}>
              <div className="mx-auto max-w-6xl px-4 py-10 sm:px-6">
                <div className="flex items-center gap-2"><span className="deva prism-text text-xl font-bold">पक्ष</span><span className={`text-lg font-bold tracking-tight ${t.tp}`}>Paksh</span></div>
                <p className={`mt-3 max-w-xl text-[12px] leading-relaxed ${t.tf} ${isHi(lang)}`}>{STR[lang].footIndependence}</p>
                <p className={`mt-3 mono text-[10px] uppercase tracking-widest ${t.tf}`}>© 2026 Redstocks Technology LLP</p>
              </div>
            </footer>
          )}
          {!openStory && <BottomNav t={t} lang={lang} view={view} go={go} />}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<PakshApp />);
  </script>
</body>
</html>
