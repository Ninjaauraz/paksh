        m_parties:"ये लेबल विचारों का वर्णन करते हैं, टीमों का नहीं — और ये मोटे अनुमान हैं, क्योंकि पार्टियाँ समय के साथ बदलती हैं और कई क्षेत्रीय पार्टियाँ किसी एक रेखा पर ठीक से नहीं बैठतीं। आम समझ के अनुसार: वाम में CPI(M) और CPI जैसी कम्युनिस्ट और समाजवादी पार्टियाँ आती हैं, जो धर्मनिरपेक्ष और कल्याण-समर्थक, श्रमिक-पहले रुख से जुड़ी हैं; दक्षिण — सबसे प्रमुख रूप से भाजपा — हिंदुत्व-प्रभावित सांस्कृतिक राष्ट्रवाद और अधिक बाज़ार-समर्थक आर्थिक रुख से जुड़ी है; केंद्र बीच में फैला है, जहाँ कांग्रेस को अक्सर केंद्र-वाम कहा जाता है और कई क्षेत्रीय पार्टियाँ मुद्दे के हिसाब से रुख मिलाती हैं। याद रखें: पक्ष समाचार आउटलेट्स को आँकता है, पार्टियों को नहीं — किसी आउटलेट का झुकाव इस बारे में है कि वह खबरों को कैसे कवर करता है, इस बारे में नहीं कि वह किसे वोट देता है।",
        m_provH:"विश्वास, विवादित और अस्थायी",
        m_prov:"आज हर रेटिंग अस्थायी है: स्वामित्व, स्व-घोषित रुख और स्थापित प्रतिष्ठा पर आधारित एक प्रलेखित शुरुआती बिंदु, रूब्रिक के विरुद्ध समीक्षित — अंतिम फ़ैसला नहीं। हर एक के साथ एक विश्वास-स्तर दिखता है, और कुछ को ‘विवादित’ चिह्नित किया गया है जहाँ झुकाव सचमुच बहस में है या स्वामित्व हाल में बदला है।",
        m_readH:"पक्ष की खबर कैसे पढ़ें", m_appealH:"सुधार और अपील",
        m_appeal:"लगता है कोई रेटिंग ग़लत है? हमें आउटलेट, जिस रेटिंग से असहमत हैं, और कुछ ठोस उदाहरण — हेडलाइन या लेख — बताएँ, और हम उसे रूब्रिक के विरुद्ध फिर से देखेंगे। रेटिंग्स को चुनौती देने के लिए ही हैं।",
        footIndependence:"पक्ष एक स्वतंत्र परियोजना है और किसी दिखाए गए आउटलेट से संबद्ध नहीं है। झुकाव के लेबल अस्थायी हैं और अपील के लिए खुले हैं।",
      }
    };

    /* ---------------- helpers ---------------- */
    const imgFor = (hue) => {
      const svg = `<svg xmlns='http://www.w3.org/2000/svg' width='480' height='300'><defs><linearGradient id='a' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='hsl(${hue} 36% 44%)'/><stop offset='1' stop-color='hsl(${(hue+38)%360} 42% 19%)'/></linearGradient><radialGradient id='b' cx='28%' cy='22%' r='65%'><stop offset='0' stop-color='rgba(255,255,255,0.30)'/><stop offset='1' stop-color='rgba(255,255,255,0)'/></radialGradient></defs><rect width='480' height='300' fill='url(%23a)'/><rect width='480' height='300' fill='url(%23b)'/></svg>`;
      return `data:image/svg+xml,${encodeURIComponent(svg)}`;
    };
    const hueOf = (s) => { let h=0; for (const c of String(s||"")) h=(h*31+c.charCodeAt(0))%360; return h; };
    const biasPct = (lc) => { const tot=(lc.left+lc.center+lc.right)||1; return {left:Math.round(lc.left/tot*100), center:Math.round(lc.center/tot*100), right:Math.round(lc.right/tot*100)}; };
    const dominant = (b) => { const k=Object.keys(b).sort((x,y)=>b[y]-b[x])[0]; return {side:k, pct:b[k]}; };
    const lbl = (side, lang) => BIAS[side][lang] || BIAS[side].en;
    const confName = (c, lang) => (({en:{low:"Low",medium:"Medium",high:"High"},hi:{low:"कम",medium:"मध्यम",high:"उच्च"}}[lang])||{})[c] || c;

    let _mode;
    function detectMode(){ if(!_mode) _mode=(async()=>{ try{ const r=await fetch("/api/topics"); if(r.ok) return "api"; }catch(e){} return "static"; })(); return _mode; }
    async function apiGet(res){ if(await detectMode()==="api"){ const r=await fetch("/api/"+res); if(r.ok) return r.json(); } const r=await fetch("data/"+res+".json?t="+Date.now()); if(!r.ok) throw new Error(res); return r.json(); }
    async function loadAll(){
      try { const [e,b,tp,sr]=await Promise.all([apiGet("events"),apiGet("blindspots"),apiGet("topics"),apiGet("sources")]);
        return {events:e.events||[], blindspots:b.events||[], topics:tp.topics||[], sources:sr.sources||[], summary:sr.summary||{}}; }
      catch(err){ console.error(err); return {events:[],blindspots:[],topics:[],sources:[],summary:{}}; }
    }

    const toCard = (e, lang) => {
      const lc = e.lean_counts || {left:0,center:0,right:0};
      return { id:e.id, topic:e.topic, srclang:e.lang||"en",
        headline:(lang==="hi"&&e.title_hi)?e.title_hi:e.title,
        lead:(lang==="hi"&&e.summary_hi)?e.summary_hi:e.summary,
        summary:(lang==="hi"&&e.summary_points_hi&&e.summary_points_hi.length)?e.summary_points_hi:(e.summary_points||[]),
        bias:biasPct(lc), counts:lc, sources:(lc.left+lc.center+lc.right)||e.total_sources||0,
        blindspot:e.blindspot?e.blindspot.side:null,
        image:e.image_url||imgFor(hueOf(e.topic||e.title)) };
    };
    const toDetail = (e, lang) => { const c=toCard(e,lang);
      c.coverage=e.coverage||{}; c.outlets=e.sources||[]; return c; };

    const isHi = (lang) => lang==="hi" ? "deva" : "";

    /* ---------------- small components ---------------- */
    function BiasBar({ bias, height="h-1.5" }) {
      const [m,setM]=useState(false);
      useEffect(()=>{ const r=requestAnimationFrame(()=>setM(true)); return ()=>cancelAnimationFrame(r); },[]);
      const w=(p)=>(m?`${p}%`:"0%");
      return (
        <div className={`flex w-full overflow-hidden rounded-full ${height} bg-zinc-200 dark:bg-zinc-800`}>
          <div className="transition-all duration-1000 ease-out" style={{width:w(bias.left), backgroundColor:BIAS.left.color}} />
          <div className="transition-all duration-1000 ease-out" style={{width:w(bias.center), backgroundColor:BIAS.center.color}} />
          <div className="transition-all duration-1000 ease-out" style={{width:w(bias.right), backgroundColor:BIAS.right.color}} />
        </div>
      );
    }
    function CoverageLine({ story, t, lang }) {
      const d=dominant(story.bias); const n=story.sources; const even=(story.counts && d.pct>0) ? false : false;
      const top=["left","center","right"].sort((a,b)=>story.counts[b]-story.counts[a]);
      const isEven=(story.counts[top[0]]-story.counts[top[1]])<=0;
      return (
        <span className={`text-xs font-semibold ${t.ts}`}>
          {isEven ? <span className="font-bold">{STR[lang].even}</span>
                  : <span className="font-bold" style={{color:BIAS[d.side].color}}>{STR[lang].most}: {lbl(d.side,lang)}</span>}
          <span className={t.tf}> · {n} {n===1?STR[lang].source:STR[lang].sources}</span>
        </span>
      );
    }
    function Eyebrow({ story, t, lang }) {
      const tp = lang==="hi" ? (TOPIC_HI[story.topic]||story.topic) : story.topic;
      return <div className={`mb-2 text-xs font-bold uppercase tracking-wider ${t.tf} ${isHi(lang)}`}>{tp}</div>;
    }
    function Monogram({ name, side }) {
      return <span className="flex shrink-0 items-center justify-center rounded-full text-white text-xs font-bold shadow-sm" style={{width:32,height:32,backgroundColor:BIAS[side].color}}>{(name||"?")[0]}</span>;
    }

    /* ---------------- cards ---------------- */
    function HeroCard({ story, t, lang, onOpen }) {
      return (
        <article onClick={()=>onOpen(story.id)} className={`group cursor-pointer overflow-hidden rounded-2xl border ${t.border} ${t.surface} transition-all duration-300 hover:shadow-xl hover:-translate-y-1`}>
          <div className="aspect-video w-full" style={{background:`center/cover url("${story.image}")`}} />
          <div className="p-6 sm:p-8">
            <Eyebrow story={story} t={t} lang={lang} />
            <h2 className={`mb-4 text-2xl sm:text-3xl font-bold leading-tight tracking-tight editorial-heading ${t.tp} ${isHi(lang)}`}>{story.headline}</h2>
            <p className={`mb-6 text-sm sm:text-base leading-relaxed ${t.ts} ${isHi(lang)}`}>{story.lead}</p>
            <BiasBar bias={story.bias} />
            <div className="mt-4 flex items-center justify-between">
              <CoverageLine story={story} t={t} lang={lang} />
              <span className={`flex items-center gap-1 text-sm font-bold ${t.brand} ${isHi(lang)}`}>{STR[lang].seeCoverage} <ChevronRight size={16} /></span>
            </div>
          </div>
        </article>
      );
    }
    function CompactRow({ story, t, lang, onOpen, last }) {
      return (
        <article onClick={()=>onOpen(story.id)} className={`group flex cursor-pointer gap-4 py-4 ${!last?`border-b ${t.border}`:""}`}>
          <div className="shrink-0 rounded-xl overflow-hidden" style={{width:78,height:78,background:`center/cover url("${story.image}")`}} />
          <div className="flex min-w-0 flex-col justify-center flex-1">
            <Eyebrow story={story} t={t} lang={lang} />
            <h3 className={`mb-2 text-[15px] font-bold leading-snug editorial-heading ${t.tp} line-clamp-2 ${isHi(lang)}`}>{story.headline}</h3>
            <BiasBar bias={story.bias} height="h-1" />
            <div className="mt-2"><CoverageLine story={story} t={t} lang={lang} /></div>
          </div>
        </article>
      );
    }
    function StoryCard({ story, t, lang, onOpen }) {
      return (
        <article onClick={()=>onOpen(story.id)} className={`group cursor-pointer overflow-hidden rounded-2xl border ${t.border} ${t.surface} transition-all duration-300 hover:shadow-lg hover:-translate-y-1 flex flex-col h-full`}>
          <div className="aspect-video w-full shrink-0" style={{background:`center/cover url("${story.image}")`}} />
          <div className="p-5 flex flex-col flex-1">
            <Eyebrow story={story} t={t} lang={lang} />
            <h3 className={`mb-4 text-lg font-bold leading-snug editorial-heading ${t.tp} line-clamp-3 ${isHi(lang)}`}>{story.headline}</h3>
            <div className="mt-auto"><BiasBar bias={story.bias} /><div className="mt-3"><CoverageLine story={story} t={t} lang={lang} /></div></div>
          </div>
        </article>
      );
    }
    function OneSidedCard({ story, t, lang, onOpen }) {
      const side=story.blindspot; const b=BIAS[side];
      return (
        <article onClick={()=>onOpen(story.id)} className={`group cursor-pointer overflow-hidden rounded-2xl border ${t.border} ${t.surface} transition-all duration-300 hover:shadow-lg hover:-translate-y-1 hover:border-rose-400 flex flex-col h-full`}>
          <div className="relative aspect-video w-full shrink-0" style={{background:`center/cover url("${story.image}")`}}>
            <div className={`absolute left-3 top-3 flex items-center gap-1.5 rounded-lg px-2.5 py-1 text-xs font-bold uppercase tracking-widest ${t.blindSoft} ${t.blind} shadow-sm backdrop-blur-md ${isHi(lang)}`}><Eye size={14} strokeWidth={2.5} /> {STR[lang].navOS}</div>
          </div>
          <div className="p-5 flex flex-col flex-1">
            <h3 className={`mb-4 text-lg font-bold leading-snug editorial-heading ${t.tp} line-clamp-3 ${isHi(lang)}`}>{story.headline}</h3>
            <div className="mt-auto"><BiasBar bias={story.bias} />
              <div className="mt-3 flex items-center justify-between">
                <span className="text-xs font-bold" style={{color:b.color}}>{STR[lang].onlyLabel} {story.bias[side]}% {lbl(side,lang)}</span>
                <span className={`text-xs font-semibold ${t.ts}`}>{story.sources} {STR[lang].sources}</span>
              </div>
            </div>
          </div>
        </article>
      );
    }

    /* ---------------- header ---------------- */
    function Header({ t, lang, setLang, dark, setDark, go }) {
      return (
        <header className={`sticky top-0 z-40 border-b ${t.border} ${t.nav} transition-all duration-300`}>
          <div className="mx-auto flex max-w-2xl items-center justify-between px-4 py-3">
            <button className="flex items-baseline gap-1.5 select-none" onClick={()=>go("home")}>
              <span className="text-2xl font-black deva text-[#0E7C73] dark:text-[#2DD4BF]">पक्ष</span>
              <span className={`text-lg font-extrabold tracking-tight ${t.tp}`}>Paksh</span>
            </button>
            <div className="flex items-center gap-2.5">
              <div className={`flex rounded-full border overflow-hidden ${t.border}`}>
                <button onClick={()=>setLang("en")} className={`px-3 py-1.5 text-xs font-bold ${lang==="en"?"bg-[#0E7C73] text-white":t.ts}`}>EN</button>
                <button onClick={()=>setLang("hi")} className={`px-3 py-1.5 text-xs font-bold deva ${lang==="hi"?"bg-[#0E7C73] text-white":t.ts}`}>हिं</button>
              </div>
              <button onClick={()=>setDark(d=>!d)} aria-label="Toggle theme" className={`flex h-9 w-9 shrink-0 items-center justify-center rounded-full border ${t.border} ${t.tp} ${t.surface}`}>{dark?<Sun size={17}/>:<Moon size={17}/>}</button>
            </div>
          </div>
        </header>
      );
    }

    /* ---------------- detail ---------------- */
    function StoryPage({ story, t, lang, onBack }) {
      const side=story.blindspot; const b=side?BIAS[side]:null;
      const order=["left","center","right"]; const rot=(((story.id||0)%3)+3)%3;
      const rotated=order.slice(rot).concat(order.slice(0,rot));
      const sides=rotated.filter(k=>(story.outlets||[]).some(o=>o.lean===k));
      return (
        <div className="pb-24 pt-8">
          <button onClick={onBack} className={`group mb-8 flex items-center gap-2 text-sm font-bold uppercase tracking-wider transition-colors ${t.ts} ${isHi(lang)}`}><ArrowLeft size={16} className="transition-transform group-hover:-translate-x-1" /> {STR[lang].back}</button>
          <div className="mb-8">
            <Eyebrow story={story} t={t} lang={lang} />
            <h1 className={`mt-3 mb-6 text-4xl sm:text-5xl lg:text-6xl font-black leading-[1.15] tracking-tight editorial-heading ${t.tp} ${isHi(lang)}`}>{story.headline}</h1>
          </div>
          <div className="grid grid-cols-1 lg:grid-cols-[1fr_380px] gap-10 xl:gap-16">
            <div className="min-w-0">
              <div className={`mb-10 aspect-[21/9] w-full overflow-hidden rounded-2xl border ${t.border} shadow-sm`} style={{background:`center/cover url("${story.image}")`}} />
              <div className={`mb-12 rounded-2xl border p-6 sm:p-8 ${t.soft} ${t.border}`}>
                <div className="mb-6 flex items-center gap-2 border-b border-zinc-200 dark:border-zinc-800 pb-4">
                  <Sparkles size={20} className={t.brand} />
                  <span className={`text-sm font-bold uppercase tracking-widest ${t.brand} ${isHi(lang)}`}>{STR[lang].aiSummary}</span>
                  <span className={`text-sm ${t.ts} ${isHi(lang)}`}>· {STR[lang].aiSub}</span>
                </div>
                {story.lead && <p className={`mb-5 text-base sm:text-lg font-medium leading-relaxed ${t.tp} ${isHi(lang)}`}>{story.lead}</p>}
                <ul className="space-y-4">
                  {story.summary.map((p,i)=>(
                    <li key={i} className={`flex items-start gap-4 text-base leading-relaxed font-medium ${t.tp} ${isHi(lang)}`}>
                      <span className={`mt-2.5 inline-block shrink-0 rounded-full h-2 w-2 ${t.brandBg}`} />{p}
                    </li>
                  ))}
                </ul>
              </div>
              <h2 className={`mb-6 flex items-center gap-2 text-xl font-bold uppercase tracking-widest ${t.tp} ${isHi(lang)}`}><Layers size={20} /> {STR[lang].sideBySide}</h2>
              <div className="space-y-8">
                {sides.map((k)=>{
                  const outs=(story.outlets||[]).filter(o=>o.lean===k);
                  return (
                    <div key={k}>
                      <div className="mb-3 flex items-center gap-3">
                        <span className="rounded-full px-3 py-1 text-[10px] font-extrabold uppercase tracking-widest text-white shadow-sm" style={{backgroundColor:BIAS[k].color}}>{lbl(k,lang)}</span>
                        <span className={`text-xs font-bold ${t.tf}`}>{outs.length} {outs.length===1?STR[lang].source:STR[lang].sources}</span>
                      </div>
                      <div className="space-y-4">
                        {outs.map((o,i)=>(
                          <a key={i} href={o.url||"#"} target="_blank" rel="noopener" className={`block rounded-2xl border p-5 sm:p-6 transition-shadow hover:shadow-md ${t.surface} ${t.border}`} style={{borderLeftWidth:"5px",borderLeftColor:BIAS[k].color}}>
                            <div className="mb-3 flex items-center gap-3">
                              <Monogram name={o.source} side={k} />
                              <div className="min-w-0">
                                <div className={`text-sm font-bold ${t.tp}`}>{o.source} <span className={`ml-1 text-[10px] font-bold ${t.tf}`}>{(o.language||"en").toUpperCase()}</span></div>
                              </div>
                              <span className={`ml-auto text-xs font-bold ${t.brand}`}>↗</span>
                            </div>
                            {o.headline && <div className={`text-lg sm:text-xl font-bold leading-snug editorial-heading italic ${t.tp} ${isHi(lang)}`}>“{o.headline}”</div>}
                          </a>
                        ))}
                      </div>
                    </div>
                  );
                })}
              </div>
            </div>
            <aside>
              <div className={`sticky top-24 rounded-2xl border p-8 ${t.surface} ${t.border} shadow-sm`}>
                <h3 className={`mb-6 text-xs font-extrabold uppercase tracking-widest ${t.ts} ${isHi(lang)}`}>{STR[lang].coverageBreakdown}</h3>
                <div className="mb-8 border-b border-zinc-100 dark:border-zinc-800/60 pb-6">
                  <div className={`mb-2 text-6xl font-black tracking-tighter ${t.tp}`}>{story.sources}</div>
                  <div className={`text-sm font-bold ${t.ts} ${isHi(lang)}`}>{STR[lang].totalSources}</div>
                </div>
                <div className={`mb-4 text-xs font-bold uppercase tracking-wide ${t.tf} ${isHi(lang)}`}>{STR[lang].whereLean}</div>
                <BiasBar bias={story.bias} height="h-2.5" />
                <div className="mt-6 flex flex-col gap-4">
                  {["left","center","right"].map((k)=>(
                    <div key={k} className={`flex items-center gap-3 text-sm font-semibold ${t.ts}`}>
                      <span className="inline-block h-4 w-4 rounded-full shadow-sm" style={{backgroundColor:BIAS[k].color}} />
                      <span style={{color:BIAS[k].color, fontWeight:800}}>{lbl(k,lang)}</span>
                      <span className={`ml-auto text-lg font-black ${t.tp}`}>{story.counts[k]}</span>
                    </div>
                  ))}
                </div>
                {b && (
                  <div className={`mt-8 flex items-start gap-3 rounded-xl p-5 text-sm leading-relaxed ${t.blindSoft} ${t.blind} border border-rose-500/20 ${isHi(lang)}`}>
                    <Eye size={20} strokeWidth={2.4} className="mt-0.5 shrink-0" />
                    <span><strong className="block mb-2 text-base font-black uppercase tracking-wider">{lbl(side,lang)} · {STR[lang].navOS}</strong>{STR[lang].osCalloutBody1} <strong className="text-lg">{story.bias[side]}%</strong> {STR[lang].osCalloutBody2}</span>
                  </div>
                )}
                <p className={`mt-8 text-xs leading-relaxed font-medium ${t.tf} ${isHi(lang)}`}>{STR[lang].aiNote}</p>
              </div>
            </aside>
          </div>
        </div>
      );
    }

    /* ---------------- sources page ---------------- */
    function SourcesPage({ t, lang, sources }) {
      const [fLean,setFLean]=useState(""); const [fLang,setFLang]=useState("");
      let list=sources||[]; if(fLean) list=list.filter(s=>s.lean===fLean); if(fLang) list=list.filter(s=>s.language===fLang);
      const Chip=({on,onClick,children})=> <button onClick={onClick} className={`rounded-full border px-4 py-1.5 text-sm font-semibold transition-colors ${on?`${t.brandBg} text-white border-transparent`:`${t.surface} ${t.border} ${t.ts}`} ${isHi(lang)}`}>{children}</button>;
      const labels={editorial:"Ed",framing:"Fr",selection:"Sel",sourcing:"Src",ownership:"Own",panel:"Pan"};
      return (
        <div className="pt-12 pb-24 max-w-4xl mx-auto">
          <h1 className={`mb-2 text-3xl sm:text-4xl font-black editorial-heading ${t.tp} ${isHi(lang)}`}>{STR[lang].srcTitle}</h1>
          <p className={`mb-6 text-lg ${t.ts} ${isHi(lang)}`}>{STR[lang].srcIntro}</p>
          <div className={`mb-8 rounded-2xl border p-5 text-sm leading-relaxed ${t.soft} ${t.border} ${t.ts} ${isHi(lang)}`}><strong className={t.tp}>{STR[lang].provisional}.</strong> {STR[lang].srcDisclaimer}</div>
          <div className="mb-8 flex flex-wrap items-center gap-2">
            <span className={`text-sm font-bold mr-1 ${t.ts} ${isHi(lang)}`}>{STR[lang].filterLean}:</span>
            <Chip on={fLean===""} onClick={()=>setFLean("")}>{STR[lang].all}</Chip>
            {["left","center","right"].map(k=><Chip key={k} on={fLean===k} onClick={()=>setFLean(k)}>{lbl(k,lang)}</Chip>)}
            <span className={`text-sm font-bold ml-3 mr-1 ${t.ts} ${isHi(lang)}`}>{STR[lang].filterLang}:</span>
            <Chip on={fLang===""} onClick={()=>setFLang("")}>{STR[lang].all}</Chip>
            <Chip on={fLang==="en"} onClick={()=>setFLang("en")}>{STR[lang].langEN}</Chip>
            <Chip on={fLang==="hi"} onClick={()=>setFLang("hi")}>{STR[lang].langHI}</Chip>
          </div>
          <div className="space-y-4">
            {list.map((s)=>{
              const fix=`mailto:${CONTACT}?subject=${encodeURIComponent("Paksh rating appeal: "+s.name)}&body=${encodeURIComponent("Outlet: "+s.name+"\nCurrent rating: "+(s.label||s.lean)+"\n\nWhy it should be reviewed (specific headlines or articles):\n\n")}`;
              return (
                <div key={s.id} className={`rounded-2xl border p-6 ${t.surface} ${t.border} shadow-sm`}>
                  <div className="flex flex-wrap items-start justify-between gap-3">
                    <div>
                      <div className={`text-base font-extrabold ${t.tp}`}>{s.name} <span className={`ml-1 text-[10px] font-bold ${t.tf}`}>{(s.language||"en").toUpperCase()}</span></div>
                      <a href={s.website} target="_blank" rel="noopener" className={`text-xs font-semibold ${t.brand}`}>{(s.website||"").replace(/^https?:\/\//,"")}</a>
                    </div>
                    <div className="flex items-center gap-2 flex-wrap">
                      <span className="rounded-full px-3 py-1 text-xs font-extrabold text-white" style={{backgroundColor:BIAS[s.lean]?BIAS[s.lean].color:"#64748B"}}>{lbl(s.lean,lang)}</span>
                      <span className={`text-xs font-semibold ${t.ts} ${isHi(lang)}`}>{confName(s.confidence,lang)} {STR[lang].confidence}</span>
                      {s.contested && <span className={`rounded px-2 py-0.5 text-[10px] font-extrabold uppercase ${t.blindSoft} ${t.blind} ${isHi(lang)}`}>{STR[lang].contested}</span>}
                    </div>
                  </div>
                  <div className={`mt-3 text-sm ${t.ts} ${isHi(lang)}`}><strong className={t.tp}>{STR[lang].ownership}:</strong> {s.ownership}</div>
                  <div className={`mt-1.5 text-sm ${t.ts} ${isHi(lang)}`}><strong className={t.tp}>{STR[lang].whyRated}:</strong> {s.rationale}</div>
                  {s.subscores && (
                    <div className="mt-3 flex flex-wrap items-center gap-1.5">
                      <span className={`text-[11px] font-bold uppercase ${t.tf} ${isHi(lang)}`}>{STR[lang].signals}:</span>
                      {Object.keys(labels).map(k=>{ const v=s.subscores[k]; const c=v<0?BIAS.left.color:v>0?BIAS.right.color:BIAS.center.color;
                        return <span key={k} className="text-[11px] font-bold rounded px-2 py-0.5 text-white" style={{backgroundColor:c}}>{labels[k]} {v>0?"+"+v:v}</span>; })}
                    </div>
                  )}
                  <a href={fix} className={`mt-4 inline-block text-xs font-bold ${t.brand} ${isHi(lang)}`}>{STR[lang].suggestFix} →</a>
                </div>
              );
            })}
          </div>
        </div>
      );
    }

    /* ---------------- method page ---------------- */
    function MethodPage({ t, lang }) {
      const S=STR[lang];
      const H=({children})=> <h2 className={`mt-10 mb-3 text-xl font-bold editorial-heading ${t.tp} ${isHi(lang)}`}>{children}</h2>;
      const P=({children})=> <p className={`mb-3 leading-relaxed ${t.ts} ${isHi(lang)}`}>{children}</p>;
      const fix=`mailto:${CONTACT}?subject=${encodeURIComponent("Paksh rating appeal")}&body=${encodeURIComponent("Outlet:\nCurrent rating:\n\nWhy it should be reviewed (specific headlines or articles):\n\n")}`;
      return (
        <div className="pt-12 pb-24 max-w-3xl mx-auto">
          <h1 className={`mb-6 text-3xl sm:text-4xl font-black editorial-heading ${t.tp} ${isHi(lang)}`}>{S.methodTitle}</h1>
          <H>{S.m_doesH}</H><P>{S.m_does}</P>
          <div className={`my-5 rounded-2xl border p-5 leading-relaxed ${t.soft} ${t.border} ${t.tp} ${isHi(lang)}`}><strong>{S.m_ruleH}.</strong> {S.m_rule}</div>
          <H>{S.m_rateH}</H><P>{S.m_rateLede}</P>
          <ul className={`my-4 rounded-2xl border overflow-hidden ${t.border}`}>
            {SIGNALS.map((s,i)=>(
              <li key={i} className={`flex items-center justify-between px-5 py-3 ${t.surface} ${i>0?`border-t ${t.border}`:""}`}>
                <span className={`font-semibold ${t.tp} ${isHi(lang)}`}>{lang==="hi"?s.hi:s.en}</span><span className={`font-black ${t.brand}`}>{s.w}%</span>
              </li>
            ))}
          </ul>
          <P><span className={t.tf}>{S.m_rateFoot}</span></P>
          <H>{S.m_axisH}</H><P>{S.m_axis}</P>
          <H>{S.m_partiesH}</H><P>{S.m_parties}</P>
          <H>{S.m_provH}</H><P>{S.m_prov}</P>
          <H>{S.m_readH}</H>
          <ul className="my-3 space-y-2">
            {M_READ[lang].map((x,i)=>(<li key={i} className={`flex items-start gap-3 leading-relaxed ${t.ts} ${isHi(lang)}`}><span className={`mt-2 inline-block shrink-0 rounded-full h-1.5 w-1.5 ${t.brandBg}`} />{x}</li>))}
          </ul>
          <H>{S.m_appealH}</H><P>{S.m_appeal}</P>
          <a href={fix} className={`inline-block rounded-full px-6 py-2.5 text-sm font-bold text-white ${t.brandBg} ${isHi(lang)}`}>{S.suggestFix}</a>
        </div>
      );
    }

    /* ---------------- topic chips ---------------- */
    function TopicChips({ t, lang, topics, topic, setTopic }) {
      if(!topics.length) return null;
      const Chip=({on,onClick,children})=> <button onClick={onClick} className={`shrink-0 rounded-full border px-4 py-1.5 text-sm font-semibold transition-colors ${on?`${t.brandBg} text-white border-transparent`:`${t.surface} ${t.border} ${t.ts} hover:bg-zinc-100 dark:hover:bg-zinc-800`} ${isHi(lang)}`}>{children}</button>;
      return (
        <div className={`flex items-center gap-3 overflow-x-auto py-5 border-b ${t.border} [&::-webkit-scrollbar]:hidden`}>
          <Chip on={!topic} onClick={()=>setTopic(null)}>{STR[lang].all}</Chip>
          {topics.map(tp=><Chip key={tp} on={topic===tp} onClick={()=>setTopic(tp)}>{lang==="hi"?(TOPIC_HI[tp]||tp):tp}</Chip>)}
        </div>
      );
    }

    /* ---------------- mobile views ---------------- */
    function OneSidedStrip({ items, t, lang, open, goOS }) {
      return (
        <section className="mb-9">
          <div className="mb-3 flex items-end justify-between">
            <div className="flex items-center gap-2"><Eye size={20} className={t.blind} /><h2 className={`text-xl font-black tracking-tight editorial-heading ${t.tp} ${isHi(lang)}`}>{STR[lang].osTitle}</h2></div>
            <button onClick={goOS} className={`flex items-center gap-0.5 text-sm font-bold ${t.brand} ${isHi(lang)}`}>{ui("seeAll",lang)} <ChevronRight size={15} /></button>
          </div>
          <div className="flex gap-4 overflow-x-auto pb-2 -mx-4 px-4 snap-x [&::-webkit-scrollbar]:hidden">
            {items.map(s=><div key={s.id} className="shrink-0 w-[270px] snap-start"><OneSidedCard story={s} t={t} lang={lang} onOpen={open} /></div>)}
          </div>
        </section>
      );
    }
    function Section({ title, items, t, lang, open, onSeeAll }) {
      const tpL = lang==="hi" ? (TOPIC_HI[title]||title) : title;
      const show = items.slice(0,3);
      return (
        <section className="mb-9">
          <div className="mb-3 flex items-end justify-between">
            <h2 className={`text-xl font-black tracking-tight editorial-heading ${t.tp} ${isHi(lang)}`}>{tpL}</h2>
            {items.length>3 && <button onClick={onSeeAll} className={`flex items-center gap-0.5 text-sm font-bold ${t.brand} ${isHi(lang)}`}>{ui("seeAll",lang)} <ChevronRight size={15} /></button>}
          </div>
          <div className={`rounded-2xl border px-4 ${t.surface} ${t.border}`}>
            {show.map((s,i)=><CompactRow key={s.id} story={s} t={t} lang={lang} onOpen={open} last={i===show.length-1} />)}
          </div>
        </section>
      );
    }
    function HomeView({ cards, oneSided, t, lang, open, goSection, goOS }) {
      const hero=cards[0];
      const rest=cards.slice(1);
      const byTopic={};
      rest.forEach(c=>{ const k=c.topic||"Society"; (byTopic[k]=byTopic[k]||[]).push(c); });
      const ordered=Object.keys(byTopic).sort((a,b)=>byTopic[b].length-byTopic[a].length);
      return (
        <div className="pt-5 pb-4">
          {hero && <div className="mb-9"><HeroCard story={hero} t={t} lang={lang} onOpen={open} /></div>}
          {oneSided.length>0 && <OneSidedStrip items={oneSided.slice(0,5)} t={t} lang={lang} open={open} goOS={goOS} />}
          {ordered.map(tp=><Section key={tp} title={tp} items={byTopic[tp]} t={t} lang={lang} open={open} onSeeAll={()=>goSection(tp)} />)}
        </div>
      );
    }
    function SectionView({ title, items, t, lang, open, onBack }) {
      const tpL = lang==="hi" ? (TOPIC_HI[title]||title) : title;
      return (
        <div className="pt-6 pb-4">
          <button onClick={onBack} className={`group mb-5 flex items-center gap-2 text-xs font-bold uppercase tracking-wider ${t.ts} ${isHi(lang)}`}><ArrowLeft size={16} className="transition-transform group-hover:-translate-x-1" /> {STR[lang].back}</button>
          <h1 className={`mb-6 text-3xl font-black tracking-tight editorial-heading ${t.tp} ${isHi(lang)}`}>{tpL}</h1>
          {items.length ? (
            <div className="grid grid-cols-1 sm:grid-cols-2 gap-5">{items.map(s=><StoryCard key={s.id} story={s} t={t} lang={lang} onOpen={open} />)}</div>
          ) : <div className={`py-20 text-center ${t.tf} ${isHi(lang)}`}>{STR[lang].noStories}</div>}
        </div>
      );
    }
    function SectionsHub({ topics, counts, t, lang, goSection, go }) {
      return (
        <div className="pt-6 pb-4">
          <h1 className={`mb-6 text-3xl font-black tracking-tight editorial-heading ${t.tp} ${isHi(lang)}`}>{ui("browse",lang)}</h1>
          <div className="grid grid-cols-2 gap-3 mb-8">
            {topics.map(tp=>(
              <button key={tp} onClick={()=>goSection(tp)} className={`flex items-center justify-between rounded-2xl border px-4 py-4 text-left transition-shadow hover:shadow-md ${t.surface} ${t.border}`}>
                <span className={`font-bold ${t.tp} ${isHi(lang)}`}>{lang==="hi"?(TOPIC_HI[tp]||tp):tp}</span>
                <span className={`ml-2 text-xs font-black ${t.tf}`}>{counts[tp]||0}</span>
              </button>
            ))}
          </div>
          <div className="space-y-3">
            <button onClick={()=>go("sources")} className={`w-full flex items-center justify-between rounded-2xl border px-5 py-4 ${t.surface} ${t.border}`}><span className={`font-bold ${t.tp} ${isHi(lang)}`}>{STR[lang].srcTitle}</span><ChevronRight size={18} className={t.tf}/></button>
            <button onClick={()=>go("method")} className={`w-full flex items-center justify-between rounded-2xl border px-5 py-4 ${t.surface} ${t.border}`}><span className={`font-bold ${t.tp} ${isHi(lang)}`}>{STR[lang].methodTitle}</span><ChevronRight size={18} className={t.tf}/></button>
          </div>
        </div>
      );
    }
    function BottomNav({ t, lang, view, go }) {
      const items=[["home",ui("top",lang),Home],["sections",ui("sections",lang),Grid],["os",ui("oneSided",lang),Eye],["search",ui("searchTab",lang),Search]];
      const isActive=(k)=> view===k || (k==="home"&&view==="section") || (k==="sections"&&(view==="sources"||view==="method"));
      return (
        <nav className={`fixed bottom-0 inset-x-0 z-40 border-t ${t.border} ${t.nav}`}>
          <div className="mx-auto flex max-w-2xl">
            {items.map(([k,label,Icon])=>(
              <button key={k} onClick={()=>go(k)} aria-label={label} className={`flex-1 flex flex-col items-center gap-0.5 py-2 ${isActive(k)?t.brand:t.tf}`}>
                <Icon size={22} strokeWidth={isActive(k)?2.4:2} /><span className={`text-[11px] font-bold ${isHi(lang)}`}>{label}</span>
              </button>
            ))}
          </div>
        </nav>
      );
    }

    /* ---------------- app ---------------- */
    function PakshApp() {
      const [lang,setLang]=useState("en");
      const [dark,setDark]=useState(false);
      const [query,setQuery]=useState("");
      const [view,setView]=useState("home");   // home | section | sections | os | search | sources | method
      const [topic,setTopic]=useState(null);
      const [openId,setOpenId]=useState(null);
      const [data,setData]=useState({events:[],blindspots:[],topics:[],sources:[],summary:{}});
      const [detail,setDetail]=useState({});
      const [ready,setReady]=useState(false);

      useEffect(()=>{ loadAll().then(d=>{ setData(d); setReady(true); }); },[]);
      useEffect(()=>{ document.documentElement.classList.toggle("dark",dark); document.body.style.backgroundColor = dark?"#0F1113":"#F1F2F3"; },[dark]);
      useEffect(()=>{ setTopic(null); setOpenId(null); setView("home"); },[lang]);   // strict EN/HI split: reset view on language switch

      const t = dark?TOKENS.dark:TOKENS.light;
      const go=(k)=>{ setView(k); setOpenId(null); setQuery(""); setTopic(null); window.scrollTo({top:0,behavior:"smooth"}); };
      const goSection=(tp)=>{ setTopic(tp); setView("section"); setOpenId(null); setQuery(""); window.scrollTo({top:0,behavior:"smooth"}); };
      const open=async(id)=>{ if(!detail[id]){ let full=null; try{ full=await apiGet("events/"+id); }catch(e){ full=(data.events||[]).concat(data.blindspots||[]).find(x=>x.id===id)||null; if(!full){ console.error("could not open event",id,e); return; } } setDetail(d=>({...d,[id]:full})); } setOpenId(id); window.scrollTo({top:0,behavior:"smooth"}); };
      const back=()=>{ setOpenId(null); window.scrollTo({top:0,behavior:"smooth"}); };

      const openStory = (openId!=null && detail[openId]) ? toDetail(detail[openId],lang) : null;

      // strict language separation: English view shows only English-sourced stories; Hindi view only Hindi
      // importance = how many outlets covered it x how many sides of the spectrum (so the
      // biggest, most-contested, most-compared story rises to the front cover)
      const importance = c => { const n=c.counts||{}; const spread=[n.left,n.center,n.right].filter(x=>x>0).length||1; return (c.sources||0)*spread; };
      const byImportance = (a,b)=>importance(b)-importance(a);
      const baseCards = data.events.map(e=>toCard(e,lang)).filter(c=>c.srclang===lang).sort(byImportance);
      const baseOne   = data.blindspots.map(e=>toCard(e,lang)).filter(c=>c.srclang===lang).sort(byImportance);
      const countsByTopic = {}; baseCards.forEach(c=>{ const k=c.topic||"Society"; countsByTopic[k]=(countsByTopic[k]||0)+1; });
      const topicsOrdered = Object.keys(countsByTopic).sort((a,b)=>countsByTopic[b]-countsByTopic[a]);
      const sectionCards = topic ? baseCards.filter(c=>c.topic===topic) : [];
      const q=query.trim().toLowerCase();
      const results = q ? baseCards.filter(c=>(c.headline||"").toLowerCase().includes(q)) : [];

      return (
        <div className={`min-h-screen font-sans transition-colors duration-300 ${t.bg} ${t.tp}`}>
          <Header t={t} lang={lang} setLang={setLang} dark={dark} setDark={setDark} go={go} />
          <main className="mx-auto max-w-2xl px-4 pb-28">
            {!ready ? (
              <div className={`py-32 text-center ${t.tf}`}>Loading…</div>
            ) : openStory ? (
              <StoryPage story={openStory} t={t} lang={lang} onBack={back} />
            ) : view==="sources" ? (
              <SourcesPage t={t} lang={lang} sources={data.sources} />
            ) : view==="method" ? (
              <MethodPage t={t} lang={lang} />
            ) : view==="search" ? (
              <div className="pt-6 pb-4">
                <div className="relative mb-6">
                  <Search size={18} className={`absolute left-4 top-1/2 -translate-y-1/2 ${t.tf}`} />
                  <input autoFocus value={query} onChange={(e)=>setQuery(e.target.value)} placeholder={STR[lang].search} className={`w-full rounded-full border py-3 pl-11 pr-4 text-base font-medium outline-none transition-colors focus:border-[#0E7C73] ${t.soft} ${t.border} ${t.tp} ${isHi(lang)}`} />
                </div>
                {!q ? (
                  <div className={`py-24 text-center ${t.tf} ${isHi(lang)}`}>{ui("searchHint",lang)}</div>
                ) : results.length ? (
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-5">{results.map(s=><StoryCard key={s.id} story={s} t={t} lang={lang} onOpen={open} />)}</div>
                ) : (
                  <div className={`flex flex-col items-center justify-center py-24 rounded-2xl border border-dashed ${t.border} ${t.ts}`}><Search size={40} className="mb-5 opacity-20" /><p className={`text-lg font-bold ${isHi(lang)}`}>{STR[lang].noResults}</p><p className={`text-sm mt-1.5 ${isHi(lang)}`}>{STR[lang].noResultsSub}</p></div>
                )}
              </div>
            ) : view==="sections" ? (
              <SectionsHub topics={topicsOrdered} counts={countsByTopic} t={t} lang={lang} goSection={goSection} go={go} />
            ) : view==="section" ? (
              <SectionView title={topic} items={sectionCards} t={t} lang={lang} open={open} onBack={()=>go("sections")} />
            ) : view==="os" ? (
              <div className="pt-6 pb-4">
                <div className="mb-2 flex items-center gap-2.5"><Eye size={26} className={t.blind} /><h1 className={`text-3xl font-black tracking-tight editorial-heading ${t.tp} ${isHi(lang)}`}>{STR[lang].osTitle}</h1></div>
                <p className={`mb-7 text-sm font-medium leading-relaxed ${t.ts} ${isHi(lang)}`}>{STR[lang].osSub}</p>
                {baseOne.length ? (
                  <div className="grid grid-cols-1 sm:grid-cols-2 gap-5">{baseOne.map(s=><OneSidedCard key={s.id} story={s} t={t} lang={lang} onOpen={open} />)}</div>
                ) : <div className={`py-24 text-center ${t.tf} ${isHi(lang)}`}>{STR[lang].noStories}</div>}
              </div>
            ) : (
              !baseCards.length ? (
                <div className={`py-28 text-center ${t.tf} ${isHi(lang)}`}>{STR[lang].noStories}</div>
              ) : (
                <HomeView cards={baseCards} oneSided={baseOne} t={t} lang={lang} open={open} goSection={goSection} goOS={()=>go("os")} />
              )
            )}
          </main>
          {!openStory && (
            <footer className={`border-t py-10 mb-16 ${t.border} ${t.surface}`}>
              <div className="mx-auto max-w-2xl px-4">
                <div className="flex items-center gap-2"><span className="text-xl font-black deva text-[#0E7C73] dark:text-[#2DD4BF]">पक्ष</span><span className={`text-lg font-extrabold tracking-tight ${t.tp}`}>Paksh</span></div>
                <p className={`mt-4 text-xs leading-relaxed ${t.tf} ${isHi(lang)}`}>{STR[lang].footIndependence}</p>
                <p className={`mt-3 text-[11px] font-semibold uppercase tracking-widest ${t.tf}`}>© 2026 Redstocks Technology LLP</p>
              </div>
            </footer>
          )}
          {!openStory && <BottomNav t={t} lang={lang} view={view} go={go} />}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<PakshApp />);
  </script>
</body>
</html>
