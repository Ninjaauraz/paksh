name: Build & publish Paksh

# Runs on a schedule (fresh news snapshot), on every push to main, and on demand.
on:
  schedule:
    - cron: "0 */6 * * *"     # every 6 hours (UTC). Tune as you like.
  push:
    branches: [ main ]
  workflow_dispatch:           # lets you click "Run workflow" manually

# Permissions needed to deploy to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Never let two publish runs overlap
concurrency:
  group: paksh-pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Check out the code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Ingest + analyze (build a fresh snapshot)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python ingest.py
          python analyze.py

      - name: Export the static site
        run: python export_static.py

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deploy
        uses: actions/deploy-pages@v4
